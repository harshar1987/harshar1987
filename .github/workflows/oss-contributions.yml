name: Update Open Source Contributions

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-oss-contributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update open source contributions section
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;

            const result = await github.rest.search.issuesAndPullRequests({
              q: `type:pr is:merged author:${owner} -user:${owner}`,
              per_page: 100,
            });

            const total = result.data.total_count;

            const counts = new Map();
            for (const item of result.data.items) {
              // repository_url looks like https://api.github.com/repos/{owner}/{repo}
              const repoFullName = item.repository_url.split('/repos/')[1];
              const url = `https://github.com/${repoFullName}`;
              const entry = counts.get(repoFullName) || { url, count: 0 };
              entry.count += 1;
              counts.set(repoFullName, entry);
            }

            const topRepos = [...counts.entries()]
              .sort((a, b) => b[1].count - a[1].count)
              .slice(0, 8);

            const rows = topRepos.map(
              ([repoFullName, { url, count }]) =>
                `| [${repoFullName}](${url}) | ${count} |`
            );

            const lines = [
              `**${total} merged pull request${total === 1 ? '' : 's'}** to public repos I don't own.`,
              '',
            ];

            if (rows.length > 0) {
              lines.push('| Repo | Merged PRs |', '| --- | --- |', ...rows);
            }

            const body = lines.join('\n');

            const start = '<!-- OSS-CONTRIBUTIONS:START -->';
            const end = '<!-- OSS-CONTRIBUTIONS:END -->';
            const readme = fs.readFileSync('README.md', 'utf8');
            const startIdx = readme.indexOf(start);
            const endIdx = readme.indexOf(end);
            if (startIdx === -1 || endIdx === -1) {
              throw new Error('OSS-CONTRIBUTIONS markers not found in README.md');
            }

            const updated =
              readme.slice(0, startIdx + start.length) +
              '\n' + body + '\n' +
              readme.slice(endIdx);

            fs.writeFileSync('README.md', updated);

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update open source contributions"
          file_pattern: README.md
