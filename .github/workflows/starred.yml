name: Update Recently Starred

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-starred:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update starred repos section
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: starred } = await github.rest.activity.listReposStarredByUser({
              username: context.repo.owner,
              sort: 'created',
              direction: 'desc',
              per_page: 6,
            });

            const rows = starred.map((repo) => {
              const desc = (repo.description || '').replace(/\|/g, '\\|');
              const lang = repo.language ? ` \`${repo.language}\`` : '';
              return `| [${repo.full_name}](${repo.html_url}) | ${desc}${lang} | ⭐ ${repo.stargazers_count} |`;
            });

            const table = [
              '| Repo | Description | Stars |',
              '| --- | --- | --- |',
              ...rows,
            ].join('\n');

            const start = '<!-- STARRED-REPOS:START -->';
            const end = '<!-- STARRED-REPOS:END -->';
            const readme = fs.readFileSync('README.md', 'utf8');
            const startIdx = readme.indexOf(start);
            const endIdx = readme.indexOf(end);
            if (startIdx === -1 || endIdx === -1) {
              throw new Error('STARRED-REPOS markers not found in README.md');
            }

            const updated =
              readme.slice(0, startIdx + start.length) +
              '\n' + table + '\n' +
              readme.slice(endIdx);

            fs.writeFileSync('README.md', updated);

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update recently starred repos"
          file_pattern: README.md
